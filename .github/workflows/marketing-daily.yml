name: Marketing Daily

on:
  schedule:
    # 22:00 UTC = 06:00 Asia/Shanghai (next day)
    - cron: "0 22 * * *"
  workflow_dispatch:

jobs:
  marketing-daily:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      id-token: write  # Required by anthropics/claude-code-action@v1 for OIDC auth
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          token: ${{ secrets.FEEDBACK_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Chinese serif font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra
          fc-list | grep -i "noto serif cjk" || (echo "Font install failed" && exit 1)
          ls /usr/share/fonts/opentype/noto/NotoSerifCJK*

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r marketing/publish/requirements.txt

      - name: Run Python tests
        run: python -m pytest marketing/publish/tests/ -v

      - name: Configure git
        run: |
          git config user.name "cathier-marketing-bot"
          git config user.email "marketing-bot@users.noreply.github.com"

      - name: Get today's date (Asia/Shanghai)
        id: date
        run: echo "today=$(TZ=Asia/Shanghai date +%F)" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code orchestrator
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Allowlist the tools the orchestrator actually needs. Without this,
          # the SDK's default permission mode deadlocks every tool call in headless
          # workflow_dispatch (29 denials + $1.57 wasted on the first run).
          claude_args: "--allowedTools Bash Read Write Edit Grep Glob"
          show_full_output: "true"
          prompt: |
            Read marketing/prompts/daily-orchestrator.md and execute it.
            Today's date: ${{ steps.date.outputs.today }}
            You have access to: OPENAI_API_KEY (env var), gh CLI, git, python3.
            Repository root is the working directory; import paths use the
            `marketing.publish.*` package.
            Do NOT push if no commits were made. Multiple runs per day are
            allowed — see the orchestrator's folder-naming rule for collisions.
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ secrets.FEEDBACK_PAT }}
