name: Auto-merge Claude PRs

on:
  # Trigger after the Build & Deploy workflow completes on a PR
  workflow_run:
    workflows: ["Build & Deploy"]
    types: [completed]

jobs:
  auto-merge:
    # Only run when the build succeeded and the PR branch is a Claude branch
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      startsWith(github.event.workflow_run.head_branch, 'claude/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write

    steps:
      - name: Find PR for this branch
        id: find-pr
        run: |
          PR_NUMBER=$(gh pr list --head "${{ github.event.workflow_run.head_branch }}" --json number --jq '.[0].number')
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.FEEDBACK_PAT }}
          GH_REPO: ${{ github.repository }}

      - name: Auto-merge Claude PR
        if: steps.find-pr.outputs.pr_number
        run: gh pr merge "${{ steps.find-pr.outputs.pr_number }}" --squash --delete-branch
        env:
          GH_TOKEN: ${{ secrets.FEEDBACK_PAT }}
          GH_REPO: ${{ github.repository }}
